<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations (Background Ambient Only) */
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveBar {
        0%, 100% { height: 18px; y: 250px; }
        50% { height: 42px; y: 226px; }
      }
      @keyframes waveBar2 {
        0%, 100% { height: 35px; y: 233px; }
        50% { height: 16px; y: 252px; }
      }
      @keyframes waveBar3 {
        0%, 100% { height: 25px; y: 243px; }
        50% { height: 48px; y: 220px; }
      }

      .bg-grid { animation: pulseGrid 6s ease-in-out infinite; }
      .p1 { animation: floatParticle 5s ease-in-out infinite; }
      .p2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
      .stream-line {
        stroke-dasharray: 12, 12;
        animation: flowData 20s linear infinite;
      }
      .b1 { animation: waveBar 2.5s ease-in-out infinite; }
      .b2 { animation: waveBar2 3s ease-in-out infinite; }
      .b3 { animation: waveBar3 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Ambient Circuit / Grid Pattern in Background -->
  <g class="bg-grid" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2">
    <line x1="80" y1="0" x2="80" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="560" y1="0" x2="560" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="880" y1="0" x2="880" y2="340" />
    <line x1="1040" y1="0" x2="1040" y2="340" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Ambient Data Flow Lines (strictly background) -->
  <path d="M 0 100 Q 300 40 600 110 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="stream-line" />
  <path d="M 0 240 Q 350 290 700 230 T 1200 250" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="stream-line" />

  <!-- Animated Floating Glow Orbs (background) -->
  <circle cx="1060" cy="80" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="980" cy="220" r="90" fill="#c084fc" opacity="0.09" filter="url(#glow)" />
  <circle cx="150" cy="280" r="80" fill="#818cf8" opacity="0.07" filter="url(#glow)" />

  <circle cx="950" cy="90" r="4" fill="#38bdf8" class="p1" />
  <circle cx="1080" cy="140" r="5" fill="#818cf8" class="p2" />
  <circle cx="1020" cy="240" r="4" fill="#c084fc" class="p3" />

  <!-- Decorative Analytics Visual Cards (Right Side Background Accents) -->
  <g transform="translate(850, 75)" filter="url(#card-shadow)">
    <!-- Small Metric Card 1: Vectorized Execution -->
    <rect x="0" y="0" width="280" height="75" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" class="badge-text" fill="#38bdf8">⚡ VECTORIZED QUERY ENGINE</text>
    <text x="20" y="56" font-family="monospace" font-size="14" fill="#f8fafc" font-weight="700">100M+ Rows/sec</text>
    <circle cx="245" cy="38" r="14" fill="#0369a1" opacity="0.4" />
    <polyline points="239,38 243,42 251,34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Small Metric Card 2: Lakehouse & Real-time OLAP -->
    <rect x="0" y="90" width="280" height="95" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="118" class="badge-text" fill="#a855f7">📊 REAL-TIME OLAP &amp; LAKEHOUSE</text>
    
    <!-- Dynamic Animated Chart Bars inside card -->
    <rect x="20" y="138" width="16" height="32" rx="3" fill="#38bdf8" opacity="0.8" class="b1" />
    <rect x="44" y="130" width="16" height="40" rx="3" fill="#818cf8" opacity="0.8" class="b2" />
    <rect x="68" y="142" width="16" height="28" rx="3" fill="#c084fc" opacity="0.8" class="b3" />
    <rect x="92" y="125" width="16" height="45" rx="3" fill="#38bdf8" opacity="0.9" class="b1" />
    <rect x="116" y="135" width="16" height="35" rx="3" fill="#818cf8" opacity="0.8" class="b2" />
    <rect x="140" y="128" width="16" height="42" rx="3" fill="#c084fc" opacity="0.9" class="b3" />
    
    <text x="175" y="152" font-family="monospace" font-size="13" fill="#94a3b8">Sub-second</text>
    <text x="175" y="168" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">Interactive BI</text>
  </g>

  <!-- FOREGROUND: Clear, Crisp Title & Subtitle (Never Obscured) -->
  <g transform="translate(60, 0)">
    <!-- Header Top Pill -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="19" class="pill-text">CURATED DATA ARCHITECTURE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">
      Awesome Big Data &amp;
    </text>
    <text x="0" y="180" class="title" fill="url(#primary-glow)">
      Analytics Engines
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="218" class="subtitle">
      Distributed SQL • Lakehouse Formats • Real-Time OLAP • Stream &amp; Batch Processing
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 248)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" class="pill-text" fill="#f8fafc">⚡ Sub-Second OLAP</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" class="pill-text" fill="#f8fafc">🏛️ Open Lakehouse</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" class="pill-text" fill="#f8fafc">🔄 Stream &amp; Batch</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(465, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" class="pill-text" fill="#f8fafc">🌐 Query Federation</text>
      </g>
    </g>
  </g>
</svg>
